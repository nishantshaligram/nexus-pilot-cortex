name: 💡 Feature Request
description: Propose a new feature, model pricing tier, or enhancement for Cortex
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea for NexusPilot Cortex.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem or token inefficiency?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've explored.
